<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a29"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Card Collector Incremental</title><style>
:root{font-family:Georgia,serif;color:#f2e7cc;background:#101723}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29334a,#101723 65%);min-height:100vh}header{padding:24px 16px 12px;text-align:center}h1{font-size:1.55rem;color:#f6d88d;margin:4px}h2{color:#f6d88d;font-size:1.25rem}p{line-height:1.45}small,.muted{color:#b7bbca}button,select{font:inherit}button{background:linear-gradient(#e9c77b,#b8873d);border:1px solid #ffe1a1;color:#1c1a22;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer;min-height:42px}button:disabled{opacity:.45}button.secondary{background:#28364b;color:#f2e7cc;border-color:#62738e}nav{position:sticky;top:0;z-index:10;display:flex;overflow-x:auto;background:#111927;border-bottom:1px solid #6b593e;padding:7px;gap:5px}nav button{white-space:nowrap;flex:1;min-width:max-content;font-size:.82rem;padding:8px}nav button.active{background:#f0c76e;color:#191923}main{max-width:800px;margin:auto;padding:14px 12px 100px}.panel{background:#1b2638;border:1px solid #5c5360;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 4px 15px #0003}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#121c2b;padding:12px;border-radius:9px}.stat b{display:block;color:#f4d18a;font-size:1.1rem}.actions{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border:3px double #a78a50;background:linear-gradient(145deg,#344557,#171d30);border-radius:10px;min-height:154px;padding:9px 5px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;gap:5px;box-shadow:inset 0 0 0 2px #111827}.card .art{font-size:2.7rem;padding:7px}.card strong{font-size:.82rem}.card small{font-size:.69rem}.card.unknown{filter:grayscale(1);opacity:.5}.Common{border-color:#9da4ac}.Uncommon{border-color:#6fc27b}.Rare{border-color:#6ea9ff}.Epic{border-color:#b78bff}.Legendary{border-color:#e7b14b}.Mythic{border-color:#fa7777}.Foil{box-shadow:inset 0 0 0 2px #b3d8f5,0 0 10px #7caac055}.Holographic{background:linear-gradient(125deg,#44385d,#20566a,#4a335f)}.Golden{background:linear-gradient(125deg,#5d441a,#a18136,#4e3515)}.Prismatic{background:linear-gradient(125deg,#553c71,#2c6975,#6a3c52)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff19}.row>div{flex:1}select{background:#121b2b;color:#f2e7cc;border:1px solid #62738e;border-radius:8px;padding:10px;max-width:100%}.notice{background:#2a3548;border-left:3px solid #f3ce81;padding:10px;border-radius:5px;margin:10px 0}.progress{height:9px;background:#0d1420;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#d9b669}#toast{position:fixed;bottom:18px;left:10%;right:10%;background:#e4c681;color:#141922;padding:12px;border-radius:10px;z-index:20;text-align:center;display:none}#results .cards{grid-template-columns:repeat(3,1fr)}.pill{display:inline-block;background:#344158;border-radius:15px;padding:4px 8px;font-size:.75rem;margin:2px}.danger{border-color:#d78888!important}footer{text-align:center;color:#9fa7b8;padding:20px} @media(min-width:650px){.cards{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div style="font-size:2rem">✦ 📖 ✦</div><h1>Card Collector Incremental</h1><small>The Collector's Beginning · Aetheria · v0.1</small></header><nav id="nav"></nav><main id="app"></main><div id="toast" role="status"></div><script>
'use strict';
const SETS=[{id:'wilds',name:'Whispering Wilds',icon:'🌿',theme:'Ancient groves, faeries, and forest guardians',unlock:0},{id:'hollow',name:'The Hollow Kingdom',icon:'🏰',theme:'Cursed royalty, restless knights, and forgotten tombs',unlock:15000},{id:'arcanum',name:'The Arcanum',icon:'🔮',theme:'Sorcerers, spellcraft, and enchanted constructs',unlock:150000}];
const NAMES={wilds:[['Mosswhisper Sprite','Dewcap Toad','Fernfoot Hare','Briar Beetle','Willow Wisp','Mushroom Sentry','Thistle Finch','Acorn Keeper','Barkhide Cub','Moonmoth'],['Thornroot Scout','Petal Dancer','Glimmer Fox','Mistwood Stag','Sapling Guardian','Duskwing Owl','Honeyglass Pixie','Rootbound Wanderer'],['Moonpetal Dryad','Verdant Archer','Grove Enchanter','Silverleaf Sentinel','Fae Lanternbearer','Ancient Vinecaller'],['Verdant Crownstag','The Emerald Seer','Heartwood Colossus'],['Eldervyrm, Guardian of Roots','Sylvara, Thorn Queen'],['The First Worldtree']],hollow:[['Graveyard Raven','Ashen Page','Crypt Rat','Pale Candle','Dustbone Guard','Mourning Bell','Wraithling','Cemetery Rose','Bone Scribe','Moonlit Specter'],['Tombwatch Knight','Cursed Herald','Hollow Huntsman','Phantom Minstrel','Blackveil Alchemist','Sepulcher Hound','Griefbound Squire','Forgotten Widow'],['The Lantern Warden','Obsidian Revenant','Cryptborne Paladin','Nightglass Oracle','Sorrowblade Duelist','The Weeping Abbot'],['Sir Vael, the Unburied','The Black Chapel','The Last Bellkeeper'],['Morvessa, the Pale Queen','King Without a Shadow'],['The Throne of Unending Night']],arcanum:[['Inkbound Imp','Copper Familiar','Rune Apprentice','Spark Mote','Dusty Grimoire','Clockwork Quill','Mana Beetle','Spellglass Orb','Aether Rat','Paper Golem'],['Glyphkeeper','Crystal Acolyte','Mirror Scribe','Arcane Librarian','Spellwoven Fox','Astral Cartographer','Rune Sentinel','Luminous Homunculus'],['Stormcall Adept','Echoward Construct','Master of Seven Seals','The Sapphire Archivist','Chronicle Weaver','Voidglass Scholar'],['Archmage Sereth','The Living Observatory','Keeper of Lost Names'],['The Infinite Librarian','Vaelora, Timebinder'],['The Unwritten Spell']]};
const RARITIES=['Common','Uncommon','Rare','Epic','Legendary','Mythic'],VALUES=[3,9,35,180,1300,12000],FINISHES=['Normal','Foil','Holographic','Golden'],FINISH_MULT=[1,3,8,30],EMOJI={wilds:['🌱','🍄','🦌','🌳','🐉','🌲'],hollow:['🦇','🕯️','⚔️','🏰','👑','🌑'],arcanum:['✨','📜','🔮','⚡','🧙','🌌']};
const CARDS=[];for(const s of SETS){let n=0;NAMES[s.id].forEach((group,r)=>group.forEach(name=>CARDS.push({id:s.id+'-'+String(++n).padStart(3,'0'),name,set:s.id,rarity:r,icon:EMOJI[s.id][r],blessing:r>=4?(r===5?0.05:0.02):0})));}
const PACKS=[{id:'standard',name:'Standard',count:5,cost:100,weights:[6500,2500,800,170,28,2],finish:[9600,320,75,5]},{id:'arcane',name:'Arcane',count:7,cost:750,weights:[3500,3500,2200,650,140,10],finish:[9400,470,120,10]},{id:'royal',name:'Royal',count:10,cost:5000,weights:[1700,2800,3200,1700,550,50],finish:[9150,650,180,20]},{id:'prismatic',name:'Prismatic',count:5,cost:20000,weights:[4500,3000,1800,580,110,10],finish:[6800,2300,800,100]}];
const BUSINESSES=[['Street Merchant',1,50],['Enchanted Stall',8,500],['Card Emporium',55,4000],['Arcane Printing Press',350,25000],['Merchant Guild',2200,150000],['Royal Mint',14000,900000],['Planar Trading Company',95000,6000000],['Celestial Exchange',600000,40000000]];
const KEY='cci-aetheria-save-v1';function fresh(){return {version:1,gold:500,totalEarned:500,runEarned:500,packs:0,ascensions:0,essence:0,essenceSpent:0,upgrades:{income:0,sales:0,luck:0,bulk:0},businesses:Array(8).fill(0),owned:{},discovered:{},achievements:{},last:Date.now(),offlineCap:7200,autoSell:true}};
let state=fresh(),tab='Packs',selectedSet='wilds',selectedPack='standard',lastResults=null,collectionFilter='all';try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1){state={...fresh(),...saved,upgrades:{...fresh().upgrades,...saved.upgrades}}}}catch(e){}
const $=id=>document.getElementById(id);const fmt=n=>n<1e4?Math.floor(n).toLocaleString():n<1e6?(n/1e3).toFixed(2)+'K':n<1e9?(n/1e6).toFixed(2)+'M':n<1e12?(n/1e9).toFixed(2)+'B':(n/1e12).toFixed(2)+'T';const key=(id,f)=>id+'|'+f;const has=k=>!!state.discovered[k];const setCount=id=>CARDS.filter(c=>c.set===id&&has(key(c.id,0))).length;const setPct=id=>setCount(id)/30;const cardBonus=()=>CARDS.reduce((a,c)=>a+(has(key(c.id,0))?c.blessing:0),0);const milestoneBonus=()=>SETS.reduce((a,s)=>a+[.25,.5,.75,1].filter(t=>setPct(s.id)>=t).length*.05,0);const incomeRate=()=>BUSINESSES.reduce((a,b,i)=>a+b[1]*state.businesses[i],0)*(1+state.upgrades.income*.3+state.ascensions*.1+cardBonus()+milestoneBonus());const sellMult=()=>1+state.upgrades.sales*.25+SETS.reduce((a,s)=>a+(setPct(s.id)>=.25?.1:0),0);const bulkMax=()=>[1,10,100,1000,10000][Math.min(4,state.upgrades.bulk)];
function toast(msg){const e=$('toast');e.textContent=msg;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',2600)}function save(){state.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Save storage unavailable. Export a backup!')}}
function earn(n){state.gold+=n;state.totalEarned+=n;state.runEarned+=n}function tick(){let now=Date.now(),dt=Math.max(0,Math.min((now-state.last)/1000,state.offlineCap));if(dt>0)earn(incomeRate()*dt);state.last=now;save();if(tab==='Packs'||tab==='Businesses')render()}let offline=Math.max(0,Math.min((Date.now()-state.last)/1000,state.offlineCap));if(offline>30){earn(incomeRate()*offline);setTimeout(()=>toast('Offline income: '+fmt(incomeRate()*offline)+' gold'),300)}save();setInterval(tick,2000);
function choose(weights){let sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<0)return i}return weights.length-1}function effectivePack(p){const w=p.weights.slice();const boost=1+state.upgrades.luck*.12;for(let i=2;i<w.length;i++)w[i]*=boost;return w}
function openPacks(q){const s=SETS.find(x=>x.id===selectedSet),p=PACKS.find(x=>x.id===selectedPack);if(state.totalEarned<s.unlock){toast('Earn '+fmt(s.unlock)+' lifetime gold to unlock this realm');return}const price=p.cost*q;if(state.gold<price){toast('Not enough gold');return}state.gold-=price;const pool=CARDS.filter(c=>c.set===s.id);let results={},newCards=0,rare=[],sold=0;for(let i=0;i<q*p.count;i++){let rarity=choose(effectivePack(p));if(p.id==='royal'&&i%p.count===0)rarity=Math.max(2,rarity);const candidates=pool.filter(c=>c.rarity===rarity);const c=candidates[Math.floor(Math.random()*candidates.length)];let finish=choose(p.finish),k=key(c.id,finish);if(!has(k)){state.discovered[k]=Date.now();newCards++}else if(state.autoSell){sold+=VALUES[rarity]*FINISH_MULT[finish]*sellMult()}else state.owned[k]=(state.owned[k]||0)+1;results[k]=(results[k]||0)+1;if(rarity>=4&&rare.length<20)rare.push({c,finish})}earn(sold);state.packs+=q;lastResults={q,p,s,newCards,sold,rare,results};save();render();toast(q+' packs opened · '+newCards+' new discoveries!')}
function cardHTML(c,finish=0,unknown=false){return `<div class="card ${RARITIES[c.rarity]} ${FINISHES[finish]} ${unknown?'unknown':''}"><small>#${c.id.split('-')[1]} · ${RARITIES[c.rarity]}</small><div class="art">${unknown?'❔':c.icon}</div><strong>${unknown?'Undiscovered':escapeHTML(c.name)}</strong><small>${unknown?'???':FINISHES[finish]}</small></div>`}function escapeHTML(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function selectOptions(items,value){return items.map(x=>`<option value="${x.id}" ${x.id===value?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}
function headerStats(){return `<div class="stats"><div class="stat"><small>Gold</small><b>${fmt(state.gold)} 🪙</b></div><div class="stat"><small>Gold/sec</small><b>${fmt(incomeRate())}</b></div><div class="stat"><small>Packs opened</small><b>${fmt(state.packs)}</b></div><div class="stat"><small>Codex</small><b>${CARDS.filter(c=>has(key(c.id,0))).length}/90</b></div></div>`}
function packsPage(){const s=SETS.find(x=>x.id===selectedSet),p=PACKS.find(x=>x.id===selectedPack);return `<section class="panel">${headerStats()}</section><section class="panel"><h2>✦ The Pack Shop</h2><p class="muted">Discover the Echoes of Aetheria. Each pack contains handcrafted fantasy cards.</p><label>Realm<br><select id="setSelect">${selectOptions(SETS.map(x=>({...x,name:x.name+(state.totalEarned<x.unlock?' 🔒 '+fmt(x.unlock)+' lifetime gold':'')})),selectedSet)}</select></label><p>${s.icon} ${s.theme}</p><label>Booster<br><select id="packSelect">${selectOptions(PACKS,selectedPack)}</select></label><p><b>${p.name} Booster</b> · ${p.count} cards · ${fmt(p.cost)} gold</p><div class="actions">${[1,10,100,1000,10000].filter(x=>x<=bulkMax()).map(q=>`<button data-open="${q}" ${state.gold<p.cost*q?'disabled':''}>Open ${fmt(q)} · ${fmt(p.cost*q)} 🪙</button>`).join('')}</div><small>Bulk capacity: ${fmt(bulkMax())}. Royal packs guarantee at least one Rare-or-better card.</small><div class="row"><div>Auto-sell duplicates</div><button class="secondary" id="autosell">${state.autoSell?'ON':'OFF'}</button></div></section>${lastResults?`<section class="panel" id="results"><h2>✨ Last opening: ${fmt(lastResults.q)} ${lastResults.p.name} packs</h2><p>${lastResults.newCards} new Codex discoveries · ${fmt(lastResults.sold)} gold from duplicates</p>${lastResults.rare.length?`<h3>Legendary & Mythic pulls</h3><div class="cards">${lastResults.rare.map(r=>cardHTML(r.c,r.finish)).join('')}</div>`:''}<p class="muted">${Object.values(lastResults.results).reduce((a,b)=>a+b,0)} cards revealed across ${Object.keys(lastResults.results).length} distinct card/finish combinations.</p></section>`:''}`}
function codexPage(){const shown=CARDS.filter(c=>collectionFilter==='all'||c.set===collectionFilter);return `<section class="panel"><h2>📖 The Grand Codex</h2><p>Every discovered identity and finish survives Ascension. One archival copy of each discovery is protected; extra copies can be sold.</p><div class="stats"><div class="stat"><small>Base cards</small><b>${CARDS.filter(c=>has(key(c.id,0))).length}/90</b></div><div class="stat"><small>All finishes</small><b>${Object.keys(state.discovered).length}/360</b></div></div><p><select id="codexFilter"><option value="all">All realms</option>${selectOptions(SETS,collectionFilter)}</select></p>${SETS.map(s=>`<div class="row"><div>${s.icon} ${s.name}<div class="progress"><div style="width:${setPct(s.id)*100}%"></div></div></div><b>${setCount(s.id)}/30</b></div>`).join('')}</section><section class="panel"><h2>Card Gallery</h2><div class="cards">${shown.map(c=>cardHTML(c,0,!has(key(c.id,0)))).join('')}</div></section><section class="panel"><h2>Finish Archive</h2><p>${FINISHES.map((f,i)=>`${f}: ${CARDS.filter(c=>has(key(c.id,i))).length}/90`).join(' · ')}</p></section>`}
function businessPage(){return `<section class="panel"><h2>🏪 Magical Enterprises</h2><p>Income continues while the game is closed (up to two hours per visit). Current income: <b>${fmt(incomeRate())} gold/sec</b>.</p>${BUSINESSES.map((b,i)=>{let cost=Math.ceil(b[2]*Math.pow(1.16,state.businesses[i]));return `<div class="row"><div><b>${b[0]}</b><br><small>Owned: ${state.businesses[i]} · Base ${fmt(b[1])}/sec each</small></div><button data-business="${i}" ${state.gold<cost?'disabled':''}>Buy ${fmt(cost)}</button></div>`}).join('')}</section>`}
function upgradePage(){const defs=[['income','Merchant Wisdom','+30% business income per level',2,2.6],['sales','Golden Appraisal','+25% duplicate sale value per level',3,2.6],['luck','Fortune Weaving','+12% relative weight for Rare+ per level',4,3],['bulk','Opening Ritual','Unlock larger bulk opening amounts',5,8]];return `<section class="panel"><h2>✨ Permanent Arcane Upgrades</h2><p>Spend Astral Essence from Ascension. These upgrades survive every reset.</p><p><b>${fmt(state.essence)} Astral Essence</b> available</p>${defs.map(([id,name,desc,base,growth])=>{const lv=state.upgrades[id],cost=Math.ceil(base*Math.pow(growth,lv));return `<div class="row"><div><b>${name} · Lv ${lv}</b><br><small>${desc}</small></div><button data-upgrade="${id}" ${state.essence<cost||(id==='bulk'&&lv>=4)?'disabled':''}>${id==='bulk'&&lv>=4?'MAX':fmt(cost)+' ✦'}</button></div>`}).join('')}</section><section class="panel"><h2>🌟 Collection Blessings</h2><p>Legendary discoveries grant +2% business income each; Mythic discoveries grant +5%. Set completion milestones grant +5% business income each.</p><p>Card blessing bonus: <b>+${Math.round(cardBonus()*100)}%</b><br>Set milestone bonus: <b>+${Math.round(milestoneBonus()*100)}%</b></p></section>`}
function ascensionPage(){const reward=Math.max(0,Math.floor(Math.sqrt(state.runEarned/10000))-state.essenceSpent*0);const available=state.runEarned>=100000;return `<section class="panel"><h2>🌌 Ascension</h2><p>Release your temporary wealth and businesses to claim Astral Essence. Your Grand Codex discoveries, one archival copy of each discovered card/finish, achievements, and permanent upgrades remain.</p><div class="stats"><div class="stat"><small>Ascensions</small><b>${state.ascensions}</b></div><div class="stat"><small>This run earned</small><b>${fmt(state.runEarned)}</b></div><div class="stat"><small>Essence reward</small><b>${fmt(reward)} ✦</b></div><div class="stat"><small>Requirement</small><b>100K gold</b></div></div><p class="muted">Your extra duplicate inventory is reset. All Codex discoveries remain. Future runs start with 500 gold.</p><button id="ascend" ${!available?'disabled':''}>Ascend for ${fmt(reward)} Essence</button></section>`}
function statsPage(){return `<section class="panel"><h2>📜 Collector's Chronicle</h2>${[['Lifetime gold earned',fmt(state.totalEarned)],['Packs opened',fmt(state.packs)],['Unique base cards',CARDS.filter(c=>has(key(c.id,0))).length+'/90'],['Card/finish discoveries',Object.keys(state.discovered).length+'/360'],['Ascensions',state.ascensions],['Extra duplicate copies',Object.values(state.owned).reduce((a,b)=>a+b,0)]].map(([a,b])=>`<div class="row"><span>${a}</span><b>${b}</b></div>`).join('')}</section><section class="panel"><h2>💾 Save Management</h2><p>Progress is saved on this device. Export backups regularly, especially before clearing Safari data or changing devices.</p><div class="actions"><button id="export">Export Save</button><button id="import">Import Save</button><input type="file" accept="application/json,.json" id="importFile" hidden></div><div class="notice">This game has no server account or cloud sync. Imported saves replace the current local save.</div></section><section class="panel"><h2>About v0.1</h2><p>90 handcrafted card identities, symbolic illustrations, three connected realms, twelve boosters, four finishes, eight businesses, and the first Ascension system. More painted artwork and content are planned for later updates.</p></section>`}
function render(){const tabs=['Packs','Codex','Businesses','Upgrades','Ascension','Statistics'];$('nav').innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${t===tab?'active':''}">${t}</button>`).join('');$('app').innerHTML=({Packs:packsPage,Codex:codexPage,Businesses:businessPage,Upgrades:upgradePage,Ascension:ascensionPage,Statistics:statsPage}[tab])();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPacks(Number(b.dataset.open)));document.querySelectorAll('[data-business]').forEach(b=>b.onclick=()=>{const i=+b.dataset.business,cost=Math.ceil(BUSINESSES[i][2]*1.16**state.businesses[i]);if(state.gold>=cost){state.gold-=cost;state.businesses[i]++;save();render()}});document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{const id=b.dataset.upgrade,defs={income:[2,2.6],sales:[3,2.6],luck:[4,3],bulk:[5,8]},cost=Math.ceil(defs[id][0]*defs[id][1]**state.upgrades[id]);if(state.essence>=cost&&!(id==='bulk'&&state.upgrades[id]>=4)){state.essence-=cost;state.essenceSpent+=cost;state.upgrades[id]++;save();render()}});if($('setSelect'))$('setSelect').onchange=e=>{selectedSet=e.target.value;render()};if($('packSelect'))$('packSelect').onchange=e=>{selectedPack=e.target.value;render()};if($('codexFilter'))$('codexFilter').onchange=e=>{collectionFilter=e.target.value;render()};if($('autosell'))$('autosell').onclick=()=>{state.autoSell=!state.autoSell;save();render()};if($('ascend'))$('ascend').onclick=()=>{if(state.runEarned<100000)return;const reward=Math.floor(Math.sqrt(state.runEarned/10000));if(!confirm(`Ascend for ${reward} Astral Essence? Your gold, businesses and extra duplicates will reset.`))return;state.essence+=reward;state.ascensions++;state.gold=500;state.runEarned=500;state.businesses=Array(8).fill(0);state.owned={};lastResults=null;save();render();toast('Ascension complete! +'+reward+' Essence')};if($('export'))$('export').onclick=()=>{save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aetheria-save-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};if($('import'))$('import').onclick=()=>$('importFile').click();if($('importFile'))$('importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.version!==1||!x.discovered||!Array.isArray(x.businesses))throw Error('Invalid save version');if(confirm('Replace your current save with this backup?')){state={...fresh(),...x};save();render();toast('Save imported')}}catch(e){toast('Could not import: '+e.message)}}}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
